[project]
name = "aej-dlt"
version = "0.1.0"
description = "dlt pipelines for Analytics Engineering Jobs source content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dlt[bigquery]==1.26.0",
    "google-cloud-bigquery-storage==2.37.0",
    "tailor-made-dlt-sources @ git+https://github.com/kingfink/dlt-sources@v0.2.0",
    "modal==1.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["aej_dlt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
